<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0f6cbd" />
    <meta name="author" content="Narashiman Krishnamurthy" />
    <meta name="description" content="Read, annotate and convert Markdown and documents in your browser. Nothing leaves your device." />
    <!--
      PNG rather than the SVG that used to be here. An SVG icon wins over every
      PNG in the list regardless of order, so leaving the old one in place kept
      the previous mark in the tab no matter what else was replaced.
    -->
    <link rel="icon" href="/favicon.png" type="image/png" sizes="32x32" />
    <link rel="icon" href="/icon-192.png" type="image/png" sizes="192x192" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Suprasuta Markdown Notes</title>
    <!--
      Suprasuta Markdown Notes
      Author: Narashiman Krishnamurthy
      https://www.linkedin.com/in/narashimank/
      Free for personal use. Not licensed for commercial use.
      mn-signature: Narashiman Krishnamurthy
    -->
    <!--
      Start-up splash: the animated logo, shown from the first paint until the
      interface has drawn, then faded out by main.tsx. Styled inline because
      app.css only arrives with the script bundle, which is exactly the wait
      this covers. Backgrounds match the window colour the app opens with, so
      nothing flashes between splash and interface.
    -->
    <style>
      #boot-splash {
        position: fixed;
        inset: 0;
        z-index: 1000; /* above everything, including the window-level band (200+) */
        display: flex;
        align-items: center;
        justify-content: center;
        background: #ffffff;
        transition: opacity 0.25s ease;
      }
      #boot-splash.gone { opacity: 0; pointer-events: none; }
      #boot-splash img { width: 72px; height: 86px; }
      #boot-splash .on-dark { display: none; }
      @media (prefers-color-scheme: dark) {
        #boot-splash { background: #1f1f1f; }
        #boot-splash .on-dark { display: block; }
        #boot-splash .on-light { display: none; }
      }
    </style>
  </head>
  <body>
    <div id="boot-splash" role="status" aria-label="Loading">
      <img class="on-light" src="./src/assets/preloader/loader-on-light.svg" alt="" />
      <img class="on-dark" src="./src/assets/preloader/loader-on-dark.svg" alt="" />
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
