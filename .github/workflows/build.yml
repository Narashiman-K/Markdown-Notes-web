name: Build

# GitHub's runners already have the Android SDK and a JDK, so the APK builds
# here without installing Android Studio locally — the same approach that
# solved the Windows SDK problem for the desktop app's MSIX package.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci
        env:
          NODE_ENV: development

      - name: Set up Python for the test fixtures
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Generate sample documents
        run: |
          python -m pip install --quiet python-docx openpyxl reportlab python-pptx
          python samples/make.py

      - name: Type check
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: |
          # npx bypasses npm scripts, so the prebuild hook does not fire here.
          node scripts/tesseract-assets.mjs
          npx vite build

      - name: Upload web build
        uses: actions/upload-artifact@v7
        with:
          name: web-build
          path: dist

  android:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up the Android SDK
        uses: android-actions/setup-android@v4

      - run: npm ci
        env:
          NODE_ENV: development

      - name: Build the web app
        run: |
          # npx bypasses npm scripts, so the prebuild hook does not fire here.
          node scripts/tesseract-assets.mjs
          npx vite build

      - name: Create the Android project
        # Generated rather than committed: it is entirely derived from
        # capacitor.config.ts, assets/ and the built web app.
        run: |
          npx cap add android
          # Fetched on demand rather than declared as a dependency: it pulls in
          # sharp, which needs a native build that fails on Windows and would
          # break `npm install` for anyone developing there.
          npx --yes @capacitor/assets@3 generate --android
          npx cap sync android

      - name: Build the APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload the APK
        uses: actions/upload-artifact@v7
        with:
          name: android-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Signed release build for Google Play.
  #
  # Play will not accept the debug APK above: it is signed with Android's public
  # debug key. This job produces an AAB signed with the upload key, and a
  # matching signed APK so the exact release build can be installed directly for
  # testing before it is uploaded.
  #
  # Runs only on a version tag, so an ordinary push cannot spend a version code.
  # ---------------------------------------------------------------------------
  release:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up the Android SDK
        uses: android-actions/setup-android@v4

      - run: npm ci
        env:
          NODE_ENV: development

      - name: Build the web app
        run: |
          # npx bypasses npm scripts, so the prebuild hook does not fire here.
          node scripts/tesseract-assets.mjs
          npx vite build

      - name: Create the Android project
        run: |
          npx cap add android
          # Fetched on demand rather than declared as a dependency: it pulls in
          # sharp, which needs a native build that fails on Windows and would
          # break `npm install` for anyone developing there.
          npx --yes @capacitor/assets@3 generate --android
          npx cap sync android

      - name: Restore the upload keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not set. See docs/PLAY-STORE.md."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"

      - name: Build the signed bundle and APK
        working-directory: android
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          # Appended to gradle.properties, which Gradle reads on its own, rather
          # than passed as -P arguments. Command-line arguments are visible in
          # the runner's process list; a properties file is not. The file exists
          # only inside a throwaway VM that is destroyed when the job ends.
          {
            echo "android.injected.signing.store.file=$RUNNER_TEMP/upload.jks"
            echo "android.injected.signing.store.password=$STORE_PASSWORD"
            echo "android.injected.signing.key.alias=$KEY_ALIAS"
            echo "android.injected.signing.key.password=$KEY_PASSWORD"
          } >> gradle.properties

          # versionName comes from the tag; versionCode from the run number,
          # which only ever increases. Play rejects a bundle whose version code
          # is not higher than the last one uploaded.
          VERSION_NAME="${GITHUB_REF_NAME#v}"
          echo "Building $VERSION_NAME (code ${GITHUB_RUN_NUMBER})"

          ./gradlew bundleRelease assembleRelease --no-daemon \
            -Pandroid.injected.version.code="${GITHUB_RUN_NUMBER}" \
            -Pandroid.injected.version.name="${VERSION_NAME}"

      - name: Confirm the bundle is signed with the upload key
        run: |
          AAB=$(find android -name '*.aab' | head -1)
          echo "bundle: $AAB"
          # A bundle signed with the debug key would show CN=Android Debug here,
          # which is the single most common reason Play rejects a first upload.
          "$ANDROID_HOME"/build-tools/*/apksigner verify --print-certs --verbose \
            android/app/build/outputs/apk/release/*.apk | grep -Ei 'Signer #1 certificate DN|v2|v3'

      - name: Upload the release bundle
        uses: actions/upload-artifact@v7
        with:
          name: play-release
          path: |
            android/app/build/outputs/bundle/release/*.aab
            android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
