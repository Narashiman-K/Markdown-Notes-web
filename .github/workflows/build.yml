name: Build

# Type check, unit tests and a production build. Vercel deploys from its own
# GitHub integration, so this workflow gates quality rather than shipping.
# The Android build lives in the Markdown-Notes-Android repository.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci
        env:
          NODE_ENV: development

      - name: Set up Python for the test fixtures
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Generate sample documents
        run: |
          python -m pip install --quiet python-docx openpyxl reportlab python-pptx
          python samples/make.py

      - name: Type check
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: |
          # npx bypasses npm scripts, so the prebuild hook does not fire here.
          node scripts/tesseract-assets.mjs
          npx vite build

      - name: Upload web build
        uses: actions/upload-artifact@v7
        with:
          name: web-build
          path: dist
