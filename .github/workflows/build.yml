name: Build

# GitHub's runners already have the Android SDK and a JDK, so the APK builds
# here without installing Android Studio locally — the same approach that
# solved the Windows SDK problem for the desktop app's MSIX package.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci
        env:
          NODE_ENV: development

      - name: Set up Python for the test fixtures
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Generate sample documents
        run: |
          python -m pip install --quiet python-docx openpyxl reportlab python-pptx
          python samples/make.py

      - name: Type check
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npx vite build

      - name: Upload web build
        uses: actions/upload-artifact@v7
        with:
          name: web-build
          path: dist

  android:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up the Android SDK
        uses: android-actions/setup-android@v4

      - run: npm ci
        env:
          NODE_ENV: development

      - name: Build the web app
        run: npx vite build

      - name: Create the Android project
        # Generated rather than committed: it is entirely derived from
        # capacitor.config.ts and the built web app.
        run: |
          npx cap add android
          npx cap sync android

      - name: Build the APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload the APK
        uses: actions/upload-artifact@v7
        with:
          name: android-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
